<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">OrionDevPartners portfolio banner</title>
  <desc id="desc">Animated banner showing a high-complexity technology portfolio spanning AI, biomedical innovation, engineering, advanced physics, and systems optimization.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#07111F">
        <animate attributeName="stop-color" values="#07111F;#0A1730;#07111F" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#102A56">
        <animate attributeName="stop-color" values="#102A56;#14376B;#102A56" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#071A2B">
        <animate attributeName="stop-color" values="#071A2B;#0B2440;#071A2B" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4FD1C5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>

  <g opacity="0.18">
    <circle cx="1030" cy="68" r="72" stroke="#4FD1C5" stroke-width="1.5">
      <animate attributeName="r" values="64;80;64" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.18;0.32;0.18" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1030" cy="68" r="46" stroke="#A78BFA" stroke-width="1.5">
      <animate attributeName="r" values="40;54;40" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1120" cy="245" r="42" stroke="#60A5FA" stroke-width="1.5">
      <animate attributeName="r" values="34;48;34" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g filter="url(#glow)">
    <path d="M0 230 C 140 170, 260 255, 380 212 S 650 148, 800 195 S 1040 248, 1200 168" stroke="url(#accent)" stroke-width="4" opacity="0.9">
      <animate attributeName="d" dur="10s" repeatCount="indefinite"
        values="M0 230 C 140 170, 260 255, 380 212 S 650 148, 800 195 S 1040 248, 1200 168;
                M0 220 C 150 155, 280 265, 390 220 S 640 138, 805 178 S 1035 255, 1200 182;
                M0 230 C 140 170, 260 255, 380 212 S 650 148, 800 195 S 1040 248, 1200 168" />
    </path>
  </g>

  <text x="72" y="112" fill="#E5F0FF" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700">
    OrionDevPartners
  </text>
  <text x="72" y="152" fill="#B7C9E6" font-family="Segoe UI, Arial, sans-serif" font-size="21">
    High-complexity technology portfolio across AI, biomedical, engineering, and frontier systems.
  </text>
  <text x="72" y="186" fill="#8ED8D0" font-family="Segoe UI, Arial, sans-serif" font-size="18">
    Public-facing overview only — problem statements, maturity signals, and partnership readiness.
  </text>

  <g transform="translate(72 220)">
    <rect width="168" height="40" rx="20" fill="#10294A" stroke="#4FD1C5" opacity="0.95"/>
    <text x="84" y="26" text-anchor="middle" fill="#DFFCF7" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600">AI + Automation</text>
  </g>
  <g transform="translate(255 220)">
    <rect width="172" height="40" rx="20" fill="#122645" stroke="#60A5FA" opacity="0.95"/>
    <text x="86" y="26" text-anchor="middle" fill="#E6F2FF" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600">Biomedical</text>
  </g>
  <g transform="translate(442 220)">
    <rect width="168" height="40" rx="20" fill="#18233F" stroke="#A78BFA" opacity="0.95"/>
    <text x="84" y="26" text-anchor="middle" fill="#F3EFFF" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600">Engineering</text>
  </g>
</svg>
